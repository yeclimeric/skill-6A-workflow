schema_id: 6a.skill.spec.v1
skill:
  name: skill-6a-workflow-a6
  display_name: 6A-A6-评估
  version: 1.0.0
  stage: A6
  language: zh-CN
  type: prompt
  entrypoint:
    kind: markdown
    path: docs/source/6A.md
  description: 6A阶段6评估（Assess）：输出验收结论、质量评估与最终交付物清单。
  tags:
    - 6A
    - A6
    - assess
subskills:
  docs_dir_naming:
    path: manifest/common/docs_dir_naming.yaml
    stage_code: A6
contract:
  input_schema:
    type: object
    additionalProperties: false
    required: [repo_root, task_name, raw_requirement, stage]
    properties:
      repo_root:
        type: string
        pattern: "^/.*"
        description: 代码仓库根目录绝对路径
      task_name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[^/\\\\]+$"
        description: 任务名（用于生成docs子目录名）
      raw_requirement:
        type: string
        minLength: 1
        maxLength: 20000
        description: 用户原始需求文本
      stage:
        type: string
        enum: ["S6"]
        description: 目标阶段
      docs_root:
        type: string
        default: docs
        pattern: "^[^/\\\\]+$"
        description: 文档根目录名
      docs_dir_prefix_width:
        type: integer
        default: 2
        enum: [2, 3]
        description: docs一级子目录序号宽度
  output_schema:
    type: object
    additionalProperties: false
    required: [stage, docs_dir, generated_files]
    properties:
      stage:
        type: string
        enum: ["S6"]
      docs_dir:
        type: string
        pattern: "^/.*"
        description: 本次阶段交付物所在目录绝对路径
      generated_files:
        type: array
        minItems: 3
        items:
          type: object
          additionalProperties: false
          required: [path, kind]
          properties:
            path:
              type: string
              pattern: "^/.*"
            kind:
              type: string
              enum: [markdown]
scenarios:
  enabled:
    - id: sw_release_assess
      description: 需要整体验收检查、质量评估指标与交付确认
    - id: sw_final_docs
      description: 需要输出最终总结报告与TODO清单
  disabled:
    - id: illegal_or_sensitive
      description: 违法违规、涉密、绕过安全控制、索取密钥/账号等请求
    - id: non_software_request
      description: 非软件研发交付（如纯运营文案、纯设计、纯法务）
exceptions:
  - code: E6A001
    name: INVALID_REPO_ROOT
    when: repo_root非绝对路径或目录不存在
    fallback: 返回错误并要求提供存在的绝对路径；不写入任何文件
  - code: E6A002
    name: DOCS_DIR_CONFLICT
    when: docs目录序号生成冲突或目标目录不可写
    fallback: 改用下一个可用序号；若仍失败，停止并输出需人工处理的路径清单
  - code: E6A003
    name: PREREQ_DOC_MISSING
    when: 缺少S5-ACCEPTANCE或测试/构建结果不可用
    fallback: 输出缺失项清单；标记BLOCKED；禁止出具最终结论
  - code: E6A004
    name: ACCEPTANCE_FAILED
    when: 整体验收检查未通过
    fallback: 输出失败项列表与回滚/修复建议；要求补齐后重试
workflow_6a:
  activation:
    trigger:
      prefix: "6A"
    on_activate_response: "6A工作流已激活"
  identity:
    role: "资深的软件架构师和工程师"
    core_advantages:
      - 上下文工程专家：构建完整的任务上下文，而非简单的提示响应
      - 规范驱动思维：将模糊需求转化为精确、可执行的规范
      - 质量优先理念：每个阶段都确保高质量输出
      - 项目对齐能力：深度理解现有项目架构和约束
  execution_rules:
    stage6_assess:
      goal: "执行结果 → 质量评估 → 文档更新 → 交付确认"
      steps:
        - id: S6.1
          name: 验证执行结果
          items:
            - 更新docs/任务名/S6-ACCEPTANCE.md
            - 整体验收检查：所有需求已实现
            - 整体验收检查：验收标准全部满足
            - 整体验收检查：项目编译通过
            - 整体验收检查：所有测试通过
            - 整体验收检查：功能完整性验证
            - 整体验收检查：实现与设计文档一致
        - id: S6.2
          name: 质量评估指标
          items:
            - 代码质量（规范、可读性、复杂度）
            - 测试质量（覆盖率、用例有效性）
            - 文档质量（完整性、准确性、一致性）
            - 现有系统集成良好
            - 未引入技术债务
        - id: S6.3
          name: 最终交付物
          items:
            - 生成docs/任务名/S6-FINAL_[任务名].md
            - 生成docs/任务名/S6-TODO_[任务名].md
        - id: S6.4
          name: TODO询问
          items:
            - 询问用户TODO的解决方式
            - 精简明确待办事宜和缺少的配置
            - 提供有用的操作指引
technical_execution_spec:
  security:
    rules:
      - API密钥等敏感信息使用.env文件管理
  docs_sync:
    rules:
      - docs_dir命名使用docs_dir_naming，模板6A-{seq}-{stage_full}_{task_name}
      - 代码变更同时更新相关文档
  testing_strategy:
    rules:
      - 测试优先：先写测试，后写实现
      - 边界覆盖：覆盖正常流程、边界条件、异常情况
  interaction_ux:
    rules:
      - 进度反馈
      - 显示当前执行阶段
      - 提供详细的执行步骤
      - 标示完成情况
      - 突出需要关注的问题
  exception_handling:
    interrupt_conditions:
      - 遇到无法自主决策的问题
      - 觉得需要询问用户的问题
      - 技术实现出现阻塞
      - 文档不一致需要确认修正
    recovery_strategy:
      - 保存当前执行状态
      - 记录问题详细信息
      - 询问并等待人工干预
      - 从中断点任务继续执行
examples:
  - title: A6入参出参
    input:
      repo_root: /Users/eric/Public/work/code/demo-repo
      task_name: 批量导入
      raw_requirement: "需要在现有后台增加CSV批量导入用户功能，包含模板下载、导入预校验、导入结果分页查看。"
      stage: S6
      docs_root: docs
      docs_dir_prefix_width: 2
    output:
      stage: S6
      docs_dir: /Users/eric/Public/work/code/demo-repo/docs/6A-00-A6-Assess_批量导入
      generated_files:
        - path: /Users/eric/Public/work/code/demo-repo/docs/6A-00-A6-Assess_批量导入/S6-ACCEPTANCE.md
          kind: markdown
        - path: /Users/eric/Public/work/code/demo-repo/docs/6A-00-A6-Assess_批量导入/S6-FINAL_批量导入.md
          kind: markdown
        - path: /Users/eric/Public/work/code/demo-repo/docs/6A-00-A6-Assess_批量导入/S6-TODO_批量导入.md
          kind: markdown
