schema_id: 6a.skill.spec.v1
skill:
  name: skill-6a-workflow-a2
  display_name: 6A-A2-架构
  version: 1.0.0
  stage: A2
  language: zh-CN
  type: prompt
  entrypoint:
    kind: markdown
    path: docs/source/6A.md
  description: 6A阶段2架构（Architect）：输出系统架构、模块设计、接口契约与异常策略。
  tags:
    - 6A
    - A2
    - architect
subskills:
  docs_dir_naming:
    path: manifest/common/docs_dir_naming.yaml
    stage_code: A2
contract:
  input_schema:
    type: object
    additionalProperties: false
    required: [repo_root, task_name, raw_requirement, stage]
    properties:
      repo_root:
        type: string
        pattern: "^/.*"
        description: 代码仓库根目录绝对路径
      task_name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[^/\\\\]+$"
        description: 任务名（用于生成docs子目录名）
      raw_requirement:
        type: string
        minLength: 1
        maxLength: 20000
        description: 用户原始需求文本
      stage:
        type: string
        enum: ["S2"]
        description: 目标阶段
      docs_root:
        type: string
        default: docs
        pattern: "^[^/\\\\]+$"
        description: 文档根目录名
      docs_dir_prefix_width:
        type: integer
        default: 2
        enum: [2, 3]
        description: docs一级子目录序号宽度
  output_schema:
    type: object
    additionalProperties: false
    required: [stage, docs_dir, generated_files]
    properties:
      stage:
        type: string
        enum: ["S2"]
      docs_dir:
        type: string
        pattern: "^/.*"
        description: 本次阶段交付物所在目录绝对路径
      generated_files:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [path, kind]
          properties:
            path:
              type: string
              pattern: "^/.*"
            kind:
              type: string
              enum: [markdown]
scenarios:
  enabled:
    - id: sw_arch_design
      description: 需要分层设计、模块依赖图、接口契约与数据流向图
    - id: sw_integration_plan
      description: 需要与现有系统对齐的集成方案与异常处理策略
  disabled:
    - id: illegal_or_sensitive
      description: 违法违规、涉密、绕过安全控制、索取密钥/账号等请求
    - id: non_software_request
      description: 非软件研发交付（如纯运营文案、纯设计、纯法务）
exceptions:
  - code: E6A001
    name: INVALID_REPO_ROOT
    when: repo_root非绝对路径或目录不存在
    fallback: 返回错误并要求提供存在的绝对路径；不写入任何文件
  - code: E6A002
    name: DOCS_DIR_CONFLICT
    when: docs目录序号生成冲突或目标目录不可写
    fallback: 改用下一个可用序号；若仍失败，停止并输出需人工处理的路径清单
  - code: E6A003
    name: PREREQ_DOC_MISSING
    when: 缺少S1-ALIGNMENT或S1-CONSENSUS
    fallback: 输出缺失文件清单；标记BLOCKED；等待补齐
  - code: E6A004
    name: TECH_DECISION_BLOCKED
    when: 存在无法自主决策且影响架构的关键问题
    fallback: 输出结构化问题清单；标记BLOCKED；等待人工澄清
workflow_6a:
  activation:
    trigger:
      prefix: "6A"
    on_activate_response: "6A工作流已激活"
  identity:
    role: "资深的软件架构师和工程师"
    core_advantages:
      - 上下文工程专家：构建完整的任务上下文，而非简单的提示响应
      - 规范驱动思维：将模糊需求转化为精确、可执行的规范
      - 质量优先理念：每个阶段都确保高质量输出
      - 项目对齐能力：深度理解现有项目架构和约束
  execution_rules:
    stage2_architect:
      goal: "共识文档 → 系统架构 → 模块设计 → 接口规范"
      steps:
        - id: S2.1
          name: 系统分层设计
          items:
            - 基于CONSENSUS、ALIGNMENT文档设计架构
            - 生成docs/任务名/6A-S2-DESIGN.md
            - 包含整体架构图（mermaid绘制）
            - 包含分层设计和核心组件
            - 包含模块依赖关系图
            - 包含接口契约定义
            - 包含数据流向图
            - 包含异常处理策略
        - id: S2.2
          name: 设计原则
          items:
            - 严格按照任务范围，避免过度设计
            - 确保与现有系统架构一致
            - 复用现有组件和模式
      quality_gates:
        - 架构图清晰准确
        - 接口定义完整
        - 与现有系统无冲突
        - 设计可行性验证
technical_execution_spec:
  security:
    rules:
      - API密钥等敏感信息使用.env文件管理
  docs_sync:
    rules:
      - docs_dir命名使用docs_dir_naming，模板{seq}-{stage_full}-{task_name}
      - 文档文件名前缀使用docs_dir_naming.rules.doc_file_prefix
      - 代码变更同时更新相关文档
  testing_strategy:
    rules:
      - 测试优先：先写测试，后写实现
      - 边界覆盖：覆盖正常流程、边界条件、异常情况
  interaction_ux:
    rules:
      - 进度反馈
      - 显示当前执行阶段
      - 提供详细的执行步骤
      - 标示完成情况
      - 突出需要关注的问题
  exception_handling:
    interrupt_conditions:
      - 遇到无法自主决策的问题
      - 觉得需要询问用户的问题
      - 技术实现出现阻塞
      - 文档不一致需要确认修正
    recovery_strategy:
      - 保存当前执行状态
      - 记录问题详细信息
      - 询问并等待人工干预
      - 从中断点任务继续执行
examples:
  - title: A2入参出参
    input:
      repo_root: /Users/eric/Public/work/code/demo-repo
      task_name: 批量导入
      raw_requirement: "需要在现有后台增加CSV批量导入用户功能，包含模板下载、导入预校验、导入结果分页查看。"
      stage: S2
      docs_root: docs
      docs_dir_prefix_width: 2
    output:
      stage: S2
      docs_dir: /Users/eric/Public/work/code/demo-repo/docs/00-A2-Architect-批量导入
      generated_files:
        - path: /Users/eric/Public/work/code/demo-repo/docs/00-A2-Architect-批量导入/6A-S2-DESIGN.md
          kind: markdown
