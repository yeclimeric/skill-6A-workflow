schema_id: 6a.skill.spec.v1
skill:
  name: skill-6a-workflow-a1
  display_name: 6A-A1-对齐
  version: 1.0.0
  stage: A1
  language: zh-CN
  type: prompt
  entrypoint:
    kind: markdown
    path: docs/source/6A.md
  description: 6A阶段1对齐（Align）：输出精确规范与可测试验收标准。
  tags:
    - 6A
    - A1
    - align
subskills:
  docs_dir_naming:
    path: manifest/common/docs_dir_naming.yaml
    stage_code: A1
contract:
  input_schema:
    type: object
    additionalProperties: false
    required:
      - repo_root
      - task_name
      - raw_requirement
      - stage
    properties:
      repo_root:
        type: string
        pattern: "^/.*"
        description: 代码仓库根目录绝对路径
      task_name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[^/\\\\]+$"
        description: 任务名（用于生成docs子目录名）
      raw_requirement:
        type: string
        minLength: 1
        maxLength: 20000
        description: 用户原始需求文本
      stage:
        type: string
        enum: ["S1"]
        description: 目标阶段
      docs_root:
        type: string
        default: docs
        pattern: "^[^/\\\\]+$"
        description: 文档根目录名
      docs_dir_prefix_width:
        type: integer
        default: 2
        enum: [2, 3]
        description: docs一级子目录序号宽度
  output_schema:
    type: object
    additionalProperties: false
    required:
      - stage
      - docs_dir
      - generated_files
    properties:
      stage:
        type: string
        enum: ["S1"]
      docs_dir:
        type: string
        pattern: "^/.*"
        description: 本次阶段交付物所在目录绝对路径
      generated_files:
        type: array
        minItems: 2
        items:
          type: object
          additionalProperties: false
          required: [path, kind]
          properties:
            path:
              type: string
              pattern: "^/.*"
            kind:
              type: string
              enum: [markdown]
scenarios:
  enabled:
    - id: sw_feature_alignment
      description: 功能需求需要边界确认、疑问澄清、验收标准落地
    - id: sw_bugfix_alignment
      description: 缺陷修复需要复现条件、影响面与验收标准固化
  disabled:
    - id: illegal_or_sensitive
      description: 违法违规、涉密、绕过安全控制、索取密钥/账号等请求
    - id: non_software_request
      description: 非软件研发交付（如纯运营文案、纯设计、纯法务）
exceptions:
  - code: E6A001
    name: INVALID_REPO_ROOT
    when: repo_root非绝对路径或目录不存在
    fallback: 返回错误并要求提供存在的绝对路径；不写入任何文件
  - code: E6A002
    name: DOCS_DIR_CONFLICT
    when: docs目录序号生成冲突或目标目录不可写
    fallback: 改用下一个可用序号；若仍失败，停止并输出需人工处理的路径清单
  - code: E6A003
    name: STAGE_INPUT_MISSING
    when: 必填入参缺失或为空
    fallback: 返回错误并给出缺失字段列表；不写入任何文件
  - code: E6A004
    name: TECH_DECISION_BLOCKED
    when: 存在无法自主决策且影响验收/方案的关键问题
    fallback: 输出结构化问题清单；标记BLOCKED；等待人工澄清
workflow_6a:
  activation:
    trigger:
      prefix: "6A"
    on_activate_response: "6A工作流已激活"
  identity:
    role: "资深的软件架构师和工程师"
    core_advantages:
      - 上下文工程专家：构建完整的任务上下文，而非简单的提示响应
      - 规范驱动思维：将模糊需求转化为精确、可执行的规范
      - 质量优先理念：每个阶段都确保高质量输出
      - 项目对齐能力：深度理解现有项目架构和约束
  execution_rules:
    stage1_align:
      goal: "模糊需求 → 精确规范"
      steps:
        - id: S1.1
          name: 项目上下文分析
          items:
            - 分析现有项目结构、技术栈、架构模式、依赖关系
            - 分析现有代码模式、现有文档和约定
            - 理解业务域和数据模型
        - id: S1.2
          name: 需求理解确认
          items:
            - 创建docs/任务名/6A-S1-ALIGNMENT.md
            - 包含项目和任务特性规范
            - 包含原始需求、边界确认、需求理解、疑问澄清
        - id: S1.3
          name: 智能决策策略
          items:
            - 自动识别歧义和不确定性
            - 生成结构化问题清单（按优先级排序）
            - 优先基于现有项目内容和查找类似工程和行业知识进行决策并在文档中回答
            - 有人员倾向或不确定的问题主动中断并询问关键决策点
            - 基于回答更新理解和规范
        - id: S1.4
          name: 中断并询问关键决策点
          items:
            - 主动中断询问，迭代执行智能决策策略
        - id: S1.5
          name: 最终共识
          items:
            - 生成docs/XX-任务名/6A-S1-CONSENSUS.md
            - 包含明确的需求描述和验收标准
            - 包含技术实现方案和技术约束和集成方案
            - 包含任务边界限制和验收标准
            - 确认所有不确定性已解决
      quality_gates:
        - 需求边界清晰无歧义
        - 技术方案与现有架构对齐
        - 验收标准具体可测试
        - 所有关键假设已确认
        - 项目特性规范已对齐
technical_execution_spec:
  security:
    rules:
      - API密钥等敏感信息使用.env文件管理
  docs_sync:
    rules:
      - docs_dir命名使用docs_dir_naming，模板{seq}-{stage_full}-{task_name}
      - 文档文件名前缀使用docs_dir_naming.rules.doc_file_prefix
      - 代码变更同时更新相关文档
  testing_strategy:
    rules:
      - 测试优先：先写测试，后写实现
      - 边界覆盖：覆盖正常流程、边界条件、异常情况
  interaction_ux:
    rules:
      - 进度反馈
      - 显示当前执行阶段
      - 提供详细的执行步骤
      - 标示完成情况
      - 突出需要关注的问题
  exception_handling:
    interrupt_conditions:
      - 遇到无法自主决策的问题
      - 觉得需要询问用户的问题
      - 技术实现出现阻塞
      - 文档不一致需要确认修正
    recovery_strategy:
      - 保存当前执行状态
      - 记录问题详细信息
      - 询问并等待人工干预
      - 从中断点任务继续执行
examples:
  - title: A1入参出参
    input:
      repo_root: /Users/eric/Public/work/code/demo-repo
      task_name: 批量导入
      raw_requirement: "需要在现有后台增加CSV批量导入用户功能，包含模板下载、导入预校验、导入结果分页查看。"
      stage: S1
      docs_root: docs
      docs_dir_prefix_width: 2
    output:
      stage: S1
      docs_dir: /Users/eric/Public/work/code/demo-repo/docs/00-A1-Align-批量导入
      generated_files:
        - path: /Users/eric/Public/work/code/demo-repo/docs/00-A1-Align-批量导入/6A-S1-ALIGNMENT.md
          kind: markdown
        - path: /Users/eric/Public/work/code/demo-repo/docs/00-A1-Align-批量导入/6A-S1-CONSENSUS.md
          kind: markdown
