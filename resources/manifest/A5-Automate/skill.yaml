schema_id: 6a.skill.spec.v1
skill:
  name: skill-6a-workflow-a5
  display_name: 6A-A5-执行
  version: 1.0.0
  stage: A5
  language: zh-CN
  type: prompt
  entrypoint:
    kind: markdown
    path: resources/manifest/A5-Automate/prompt.md
  description: 6A阶段5执行（Automate）：按任务依赖顺序实施、测试、验证并同步文档。
  tags:
    - 6A
    - A5
    - automate
subskills:
  docs_dir_naming:
    path: resources/manifest/common/docs_dir_naming.yaml
    stage_code: A5
contract:
  input_schema:
    type: object
    additionalProperties: false
    required: [repo_root, task_name, raw_requirement, stage]
    properties:
      repo_root:
        type: string
        pattern: "^/.*"
        description: 代码仓库根目录绝对路径
      task_name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[^/\\\\]+$"
        description: 任务名（用于生成docs子目录名）
      raw_requirement:
        type: string
        minLength: 1
        maxLength: 20000
        description: 用户原始需求文本
      stage:
        type: string
        enum: ["S5"]
        description: 目标阶段
      docs_root:
        type: string
        default: docs
        pattern: "^[^/\\\\]+$"
        description: 文档根目录名
      docs_dir_prefix_width:
        type: integer
        default: 2
        enum: [2, 3]
        description: docs一级子目录序号宽度
  output_schema:
    type: object
    additionalProperties: false
    required: [stage, docs_dir, generated_files]
    properties:
      stage:
        type: string
        enum: ["S5"]
      docs_dir:
        type: string
        pattern: "^/.*"
        description: 本次阶段交付物所在目录绝对路径
      generated_files:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [path, kind]
          properties:
            path:
              type: string
              pattern: "^/.*"
            kind:
              type: string
              enum: [markdown]
scenarios:
  enabled:
    - id: sw_step_execute
      description: 需要按依赖顺序逐步实现、写测试、运行验证并记录完成情况
    - id: sw_acceptance_trace
      description: 需要生成执行验收记录并同步文档
  disabled:
    - id: illegal_or_sensitive
      description: 违法违规、涉密、绕过安全控制、索取密钥/账号等请求
    - id: non_software_request
      description: 非软件研发交付（如纯运营文案、纯设计、纯法务）
exceptions:
  - code: E6A001
    name: INVALID_REPO_ROOT
    when: repo_root非绝对路径或目录不存在
    fallback: 返回错误并要求提供存在的绝对路径；不写入任何文件
  - code: E6A002
    name: DOCS_DIR_CONFLICT
    when: docs目录序号生成冲突或目标目录不可写
    fallback: 改用下一个可用序号；若仍失败，停止并输出需人工处理的路径清单
  - code: E6A003
    name: PREREQ_DOC_MISSING
    when: 缺少S4交付物或关键决策未关闭
    fallback: 输出缺失项清单；标记BLOCKED；禁止进入执行
  - code: E6A004
    name: EXECUTION_BLOCKED
    when: 运行验证失败或出现无法决策的技术阻塞
    fallback: 记录失败点与复现步骤；输出下一步建议；等待人工澄清后继续
workflow_6a:
  activation:
    trigger:
      prefix: "6A"
    on_activate_response: "6A工作流已激活"
  identity:
    role: "资深的软件架构师和工程师"
    core_advantages:
      - 上下文工程专家：构建完整的任务上下文，而非简单的提示响应
      - 规范驱动思维：将模糊需求转化为精确、可执行的规范
      - 质量优先理念：每个阶段都确保高质量输出
      - 项目对齐能力：深度理解现有项目架构和约束
  execution_rules:
    stage5_automate:
      goal: "按节点执行 → 编写测试 → 实现代码 → 文档同步"
      steps:
        - id: S5.1
          name: 逐步实施子任务
          items:
            - 创建docs/任务名/S5-ACCEPTANCE.md记录完成情况
        - id: S5.2
          name: 代码质量要求
          items:
            - 严格遵循项目现有代码规范
            - 保持与现有代码风格一致
            - 使用项目现有的工具和库
            - 复用项目现有组件
            - 代码尽量精简易读
            - API KEY放到.env文件中并且不要提交git
        - id: S5.3
          name: 异常处理
          items:
            - 遇到不确定问题立刻中断执行
            - 在TASK文档中记录问题详细信息和位置
            - 寻求人工澄清后继续
        - id: S5.4
          name: 逐步实施流程
          items:
            - 按任务依赖顺序执行
            - 执行前检查（验证输入契约、环境准备、依赖满足）
            - 实现核心逻辑（按设计文档编写代码）
            - 编写单元测试（边界条件、异常情况）
            - 运行验证测试
            - 更新相关文档
            - 每完成一个任务立即验证
technical_execution_spec:
  security:
    rules:
      - API密钥等敏感信息使用.env文件管理
  docs_sync:
    rules:
      - docs_dir命名使用docs_dir_naming，模板6A-{seq}-{stage_full}_{task_name}
      - 代码变更同时更新相关文档
  testing_strategy:
    rules:
      - 测试优先：先写测试，后写实现
      - 边界覆盖：覆盖正常流程、边界条件、异常情况
  interaction_ux:
    rules:
      - 进度反馈
      - 显示当前执行阶段
      - 提供详细的执行步骤
      - 标示完成情况
      - 突出需要关注的问题
  exception_handling:
    interrupt_conditions:
      - 遇到无法自主决策的问题
      - 觉得需要询问用户的问题
      - 技术实现出现阻塞
      - 文档不一致需要确认修正
    recovery_strategy:
      - 保存当前执行状态
      - 记录问题详细信息
      - 询问并等待人工干预
      - 从中断点任务继续执行
examples:
  - title: A5入参出参
    input:
      repo_root: /Users/eric/Public/work/code/demo-repo
      task_name: 批量导入
      raw_requirement: "需要在现有后台增加CSV批量导入用户功能，包含模板下载、导入预校验、导入结果分页查看。"
      stage: S5
      docs_root: docs
      docs_dir_prefix_width: 2
    output:
      stage: S5
      docs_dir: /Users/eric/Public/work/code/demo-repo/docs/6A-00-A5-Automate_批量导入
      generated_files:
        - path: /Users/eric/Public/work/code/demo-repo/docs/6A-00-A5-Automate_批量导入/S5-ACCEPTANCE.md
          kind: markdown
